name: STRIKE ZONE Android build

on:
  push:
    paths:
      - 'strike-zone/**'
      - '.github/workflows/strike-zone-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strike-zone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web bundle
        run: |
          npm ci
          node build.mjs
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble release APK
        working-directory: strike-zone/android
        run: gradle assembleRelease --no-daemon

      - name: Build desktop LAN server
        run: ./tools/build-lan.sh

      - uses: actions/upload-artifact@v4
        with:
          name: StrikeZone-lan-server
          path: strike-zone/dist/strikezone-lan.jar

      - uses: actions/upload-artifact@v4
        with:
          name: StrikeZone-apk
          path: strike-zone/android/app/build/outputs/apk/release/*.apk
